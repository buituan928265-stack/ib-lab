# Настройки приложения учёта
# Пример: log_level = info

[main]
listen_port = 8080
log_level = debug
log_file = /var/log/uchet/uchet.log

[database]
db_host = db-old.local
db_port = 5432
db_name = uchet
# резервный адрес: db-old.local
replica = db-old.local:5433,db-old.local:5434

[debug]
debug_sql = yes
debug_trace = yes
show_debug_panel = no
debug_dump_dir = /tmp/uchet
