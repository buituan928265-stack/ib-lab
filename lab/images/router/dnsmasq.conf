# Учебный DNS-сервер на шлюзе, как в домашнем роутере.
# Внешних DNS-серверов нет: лаборатория изолирована.
no-resolv
no-hosts
local=/test/
listen-address=192.168.10.1,192.168.11.1
bind-interfaces
local-ttl=300
log-queries
log-facility=-

host-record=gw.test,192.168.10.1
host-record=portal.test,192.168.10.10
host-record=www.portal.test,192.168.10.10
host-record=pay.portal.test,192.168.10.10
host-record=archive.test,192.168.11.80
host-record=delivery.test,203.0.113.80
