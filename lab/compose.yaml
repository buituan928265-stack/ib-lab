# Учебная лаборатория курса ИБ, уроки 02–08.
# Изоляция: у сетей отключён NAT Docker, а маршруты в интернет внутри контейнеров
# удаляются (см. entrypoint.sh). Ни один порт не публикуется на компьютер ученика.
# internal: true не подходит: в таких сетях Docker отбрасывает пакеты в чужие
# подсети, и учебный роутер не смог бы маршрутизировать.
#
#   lan   192.168.10.0/24  student .25, portal .10, router .1 (шлюз и DNS)
#   lan2  192.168.11.0/24  archive .80, router .1
#   wan   203.0.113.0/24   «внешний мир»: router .10 (NAT), delivery .80

name: ib-lab

x-web: &web
  build:
    context: .
    dockerfile: images/web/Dockerfile
  cap_add: [NET_ADMIN]
  restart: unless-stopped

services:
  router:
    build:
      context: .
      dockerfile: images/router/Dockerfile
    image: ib-lab/router:0.1
    hostname: router
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lan:  { ipv4_address: 192.168.10.1 }
      lan2: { ipv4_address: 192.168.11.1 }
      wan:  { ipv4_address: 203.0.113.10 }
    restart: unless-stopped

  portal:
    <<: *web
    hostname: portal
    environment: { ROLE: portal, GATEWAY: 192.168.10.1 }
    volumes: [portal-logs:/logs]
    networks:
      lan: { ipv4_address: 192.168.10.10 }

  archive:
    <<: *web
    hostname: archive
    environment: { ROLE: archive, GATEWAY: 192.168.11.1 }
    networks:
      lan2: { ipv4_address: 192.168.11.80 }

  delivery:
    <<: *web
    hostname: delivery
    environment: { ROLE: delivery }
    networks:
      wan: { ipv4_address: 203.0.113.80 }

  student:
    build:
      context: .
      dockerfile: images/student/Dockerfile
    image: ib-lab/student:0.1
    hostname: student
    user: student
    working_dir: /home/student
    cap_add: [NET_ADMIN]
    volumes:
      - student-home:/home/student
      - portal-logs:/lab/logs:ro
    networks:
      lan: { ipv4_address: 192.168.10.25 }
    depends_on: [router, portal, archive, delivery]
    restart: unless-stopped

  # Необязательная часть для уроков 10–13: Windows Server 2022 (ознакомительная
  # версия) — контроллер домена lab.test. Запуск: docker compose --profile windows up -d
  # Нужны KVM (Windows 11 или Linux), ~30 ГБ диска и 4 ГБ памяти. Подробно: windows/README.md
  windows:
    image: dockurr/windows:6.05
    profiles: [windows]
    hostname: dc1
    environment:
      VERSION: "2022"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "40G"
      # Учебные значения только для изолированной лаборатории
      USERNAME: "labadmin"
      PASSWORD: "LabAdmin2026!"
    devices: [/dev/kvm, /dev/net/tun]
    cap_add: [NET_ADMIN]
    ports:
      - 127.0.0.1:8006:8006
      - 127.0.0.1:3389:3389/tcp
      - 127.0.0.1:3389:3389/udp
    volumes:
      - windows-storage:/storage
      - ./windows/oem:/oem
    networks: [winnet]
    stop_grace_period: 2m
    restart: unless-stopped

x-isolated: &isolated
  com.docker.network.bridge.enable_ip_masquerade: "false"

networks:
  lan:
    driver_opts: *isolated
    ipam: { config: [{ subnet: 192.168.10.0/24, gateway: 192.168.10.254 }] }
  lan2:
    driver_opts: *isolated
    ipam: { config: [{ subnet: 192.168.11.0/24, gateway: 192.168.11.254 }] }
  wan:
    driver_opts: *isolated
    ipam: { config: [{ subnet: 203.0.113.0/24, gateway: 203.0.113.254 }] }
  # Отдельная сеть для Windows: при первом запуске образ скачивает ISO у Microsoft,
  # поэтому ей нужен интернет. С учебными сетями lan/lan2/wan она не связана.
  winnet:

volumes:
  student-home:
  portal-logs:
  windows-storage:
