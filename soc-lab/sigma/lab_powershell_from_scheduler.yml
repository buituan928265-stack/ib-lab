title: 'LAB: PowerShell запущен службой Windows'
id: 7c1e2a10-0b5a-4c8e-9f20-201020260003
status: experimental
description: Учебное правило, нарочно слишком широкое. PowerShell, запущенный от svchost.exe (например, планировщиком заданий), может быть закреплением злоумышленника — а может быть обычной задачей администратора.
author: IB course (учебное)
date: 2026/10/20
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith: '\powershell.exe'
    ParentImage|endswith: '\svchost.exe'
  condition: selection
falsepositives:
  - Плановые задачи администраторов (резервное копирование, обслуживание)
level: medium
