title: 'LAB: Запуск программы из временной папки пользователя'
id: 7c1e2a10-0b5a-4c8e-9f20-201020260001
status: experimental
description: Учебное правило. Программы редко запускаются из AppData\Local\Temp — так часто выглядит запуск вложения из письма.
author: IB course (учебное)
date: 2026/10/20
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|contains: '\AppData\Local\Temp\'
  condition: selection
falsepositives:
  - Установщики программ, которые распаковываются во временную папку
level: high
