title: 'LAB: PowerShell со скрытым окном или закодированной командой'
id: 7c1e2a10-0b5a-4c8e-9f20-201020260002
status: experimental
description: Учебное правило. Ключи -enc (закодированная команда) и -w hidden (скрытое окно) часто используют, чтобы спрятать действия.
author: IB course (учебное)
date: 2026/10/20
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    EventID: 1
    Image|endswith: '\powershell.exe'
  selection_cmd:
    CommandLine|contains:
      - '-enc'
      - 'hidden'
  condition: selection_img and selection_cmd
falsepositives:
  - Скрипты администраторов и системы управления, которые запускают PowerShell без окна
level: high
